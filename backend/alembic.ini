# Alembic configuration for the NEXUS platform database.
#
# The database URL is intentionally NOT here: alembic/env.py reads it from
# the application settings (backend/app/.env), so there is exactly one
# source of configuration. Run from the backend/ directory:
#
#   alembic upgrade head        # apply pending migrations
#   alembic current             # show the applied revision
#   alembic revision --autogenerate -m "describe the change"
#
# Migrations are also applied automatically at API startup (see
# app/core/database.py: init_database), so a dev environment never needs
# to run alembic by hand — but the CLI is the supported path for deploys.

[alembic]
script_location = alembic
prepend_sys_path = .
# left empty on purpose; env.py injects settings.database_url
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
